<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>PO-33 K.O!</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./panel.css">
<link rel="stylesheet" href="./transfer-panel.css">
</head>
<body data-mode="PLAY">

  <div id="hdr">
    <div id="hdrMain">
      <div id="hdrTop">
        <span id="mode">PLAY</span>
        <span id="pat">P1</span>
        <span id="slot">SLOT 1</span>
        <span id="mem">40.0s</span>
      </div>
      <div id="hint">WHEEL BPM &middot; SIDE SOUND</div>
    </div>
    <svg id="boxing-rabbit-svg" viewBox="0 0 240 120" width="64" height="32" xmlns="http://w3.org">
      <style>
        #glove-left, #glove-right, #rabbit-head {
          transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.3, 1.2);
          transform-origin: center;
        }
        .punch-left { transform: translate(-6px, 4px) scale(1.18) rotate(-8deg); }
        .punch-right { transform: translate(6px, 4px) scale(1.18) rotate(8deg); }
        .head-bob { transform: translateY(-3px) rotate(-3deg); }
        .rec-pulse path { fill: #FF3B00 !important; }
      </style>

      <!-- Center: Small Isometric White Rabbit Head -->
      <g id="rabbit-head">
        <!-- Left &amp; Right Angled Ears -->
        <polygon points="96,42 86,16 102,22 110,42" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
        <polygon points="122,42 122,18 136,26 136,48" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Rounded Isometric Hexagon Head -->
        <path d="M94,52 Q94,45 102,42 L116,38 Q123,37 129,42 L139,50 Q143,54 143,60 L143,72 Q143,78 137,81 L122,88 Q116,91 109,87 L97,79 Q94,76 94,70 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- '+' Nose and Dot Eye -->
        <path d="M101,63 L109,67 M105,60 L105,70" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="117" cy="69" r="3" fill="#000000"/>
      </g>

      <!-- Left Oversized Cute Rounded Orange Boxing Glove -->
      <g id="glove-left">
        <!-- Wrist Cuff -->
        <path d="M24,78 Q22,98 44,98 Q66,98 68,80 L64,72 L28,72 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Main Chubby Glove Body -->
        <path d="M20,46 Q18,22 46,22 Q72,22 72,46 Q72,76 44,78 Q20,78 20,46 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Inner Curl &amp; Tucked Thumb -->
        <path d="M30,48 Q44,58 58,50" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M56,52 Q54,62 54,66" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M62,42 Q80,40 80,52 Q80,62 64,60 Q54,58 56,48 Q58,42 62,42 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
      </g>

      <!-- Right Oversized Cute Rounded Orange Boxing Glove -->
      <g id="glove-right">
        <!-- Wrist Cuff -->
        <path d="M216,78 Q218,98 196,98 Q174,98 172,80 L176,72 L212,72 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Main Chubby Glove Body -->
        <path d="M220,46 Q222,22 194,22 Q168,22 168,46 Q168,76 196,78 Q220,78 220,46 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Inner Curl &amp; Tucked Thumb -->
        <path d="M210,48 Q196,58 182,50" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M184,52 Q186,62 186,66" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M178,42 Q160,40 160,52 Q160,62 176,60 Q186,58 184,48 Q182,42 178,42 Z" fill="#FF4D00" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
      </g>
    </svg>
    <button id="paramBtn" class="hbtn" type="button" aria-label="Parameter: BPM, TRIM or PITCH">
      <span class="hname" id="paramName">BPM</span>
      <span class="hval" id="paramVal">120</span>
    </button>
    <button id="expBtn" class="hbtn" type="button" aria-label="Export WAV">EXP</button>
  </div>

  <div id="panel" aria-label="PO-33 sampler controls">
    <img id="panelArt" src="./panel-art.svg" alt="" draggable="false">
    <svg id="lcd" viewBox="0 0 240 282" aria-label="Sampler status">
      <text id="lcdMode" x="1" y="14.4" fill="#fff" font-family="Arial,sans-serif" font-size="8">DISCO</text>
      <g id="lcdRecord" transform="translate(-7 0)"><rect x="177" y="5" width="13" height="13" fill="#fff"/><circle cx="183.5" cy="11.5" r="5" fill="#000"/></g>
      <path transform="translate(-8 0)" id="lcdPlay" d="M197 5L207 11.5L197 18Z" fill="#fff"/>
      <text id="lcdNumber" x="238" y="17.8" text-anchor="end" font-family="DSEG7,monospace" font-size="14.5" fill="#fff">120</text>
      <g id="transportMascot">
        <g id="tapeHead"><image href="./mascot-head.svg" x="109" y="0" width="23" height="22"/></g>
        <g id="tapeLeft"><image href="./mascot-left.svg" x="93" y="5" width="15" height="17"/></g>
        <g id="tapeRight"><image href="./mascot-right.svg" x="132" y="5" width="15" height="17"/></g>
      </g>
      <g id="lcdIn"><rect x="0" y="23" width="16" height="7" rx="3" fill="#222"/><text x="8" y="28.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#888">IN</text></g>
      <g id="lcdOut"><rect x="224" y="23" width="16" height="7" rx="3" fill="#222"/><text x="232" y="28.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#888">OUT</text></g>
      <g id="lcdMeter"></g>
      <g id="factoryReset" role="button" tabindex="0" aria-label="Hold rabbit head for 5 seconds to erase saved sounds and patterns and restore factory presets">
        <title>Hold 5 seconds to restore factory presets</title>
        <rect x="109" y="0" width="23" height="22" fill="transparent"/>
      </g>
    </svg>
    <div id="panelText" aria-hidden="true"><span class="panel-label " style="--tx:32.2;--ty:71.8;--tw:42;--fs:10.9;color:#ff5705">sound</span><span class="panel-label " style="--tx:76;--ty:71.8;--tw:43;--fs:10.9;color:#999">pattern</span><span class="panel-label bpm-label" style="--tx:119.8;--ty:71.8;--tw:43;--fs:10.9;color:#999">bpm <i>m</i></span><span class="panel-label " style="--tx:32.2;--ty:120.2;--tw:38;--fs:13;color:#999">1</span><span class="panel-label " style="--tx:76.0;--ty:120.2;--tw:38;--fs:13;color:#999">2</span><span class="panel-label " style="--tx:119.8;--ty:120.2;--tw:38;--fs:13;color:#999">3</span><span class="panel-label " style="--tx:163.59999999999997;--ty:120.2;--tw:38;--fs:13;color:#999">4</span><span class="panel-label " style="--tx:32.2;--ty:170.0;--tw:38;--fs:13;color:#999">5</span><span class="panel-label " style="--tx:76.0;--ty:170.0;--tw:38;--fs:13;color:#999">6</span><span class="panel-label " style="--tx:119.8;--ty:170.0;--tw:38;--fs:13;color:#999">7</span><span class="panel-label " style="--tx:163.59999999999997;--ty:170.0;--tw:38;--fs:13;color:#999">8</span><span class="panel-label " style="--tx:32.2;--ty:219.8;--tw:38;--fs:13;color:#999">9</span><span class="panel-label " style="--tx:76.0;--ty:219.8;--tw:38;--fs:13;color:#999">10</span><span class="panel-label " style="--tx:119.8;--ty:219.8;--tw:38;--fs:13;color:#999">11</span><span class="panel-label " style="--tx:163.59999999999997;--ty:219.8;--tw:38;--fs:13;color:#999">12</span><span class="panel-label " style="--tx:32.2;--ty:269.59999999999997;--tw:38;--fs:13;color:#999">13</span><span class="panel-label " style="--tx:76.0;--ty:269.59999999999997;--tw:38;--fs:13;color:#999">14</span><span class="panel-label " style="--tx:119.8;--ty:269.59999999999997;--tw:38;--fs:13;color:#999">15</span><span class="panel-label " style="--tx:163.59999999999997;--ty:269.59999999999997;--tw:38;--fs:13;color:#999">16</span><span class="panel-label record-label" style="--tx:207.4;--ty:120.1;--tw:44;--fs:11.2;color:#000">record</span><span class="panel-label " style="--tx:207.4;--ty:169.8;--tw:44;--fs:12;color:#999">FX</span><span class="panel-label " style="--tx:207.4;--ty:219.6;--tw:44;--fs:11.5;color:#999">play</span><span class="panel-label " style="--tx:207.4;--ty:269.4;--tw:44;--fs:11.5;color:#999">write</span><span class="bank-label melodic-bank">MELODIC</span><span class="bank-label drum-bank">DRUM</span></div>
    <div id="ctl">
      <button class="cbtn" type="button" data-act="sound" aria-label="Sound" style="--x:32.2;--y:52.8">sound</button>
      <button class="cbtn" type="button" data-act="pattern" aria-label="Pattern" style="--x:76;--y:52.8">pattern</button>
      <button id="bpmMode" type="button" aria-label="BPM: tap presets; hold and turn A for swing or B for tempo" style="--x:119.8;--y:52.8">bpm</button>
      <button id="knobA" class="knob" type="button" aria-label="Knob A: pitch, filter or trim start; hold BPM for swing" style="--x:163.6;--y:52.8"><span class="knob-rotor" aria-hidden="true"><img src="./knob-a.svg" alt="" draggable="false"></span></button>
      <button id="knobB" class="knob" type="button" aria-label="Knob B: volume, resonance or trim length; hold BPM for tempo" style="--x:207.4;--y:52.8"><span class="knob-rotor" aria-hidden="true"><img src="./knob-b.svg" alt="" draggable="false"></span></button>
      <button class="cbtn" type="button" data-act="rec" aria-label="Record: hold and press a pad to sample" style="--x:207.4;--y:102.6">record</button>
      <button class="cbtn" type="button" data-act="fx" aria-label="Effects" style="--x:207.4;--y:152.4">FX</button>
      <button class="cbtn" type="button" data-act="play" aria-label="Play or stop" style="--x:207.4;--y:202.2">play<span class="led" style="left:33.1134%;top:6.588%;width:31.578947%;height:4.347826%" aria-hidden="true"></span></button>
      <button class="cbtn" type="button" data-act="write" aria-label="Write: toggle step editing" style="--x:207.4;--y:252">write</button>
      <div id="wrap"><div id="grid"></div></div>
    </div>
  </div>

  <script src="./presets.js"></script>
  <script src="./po33-fx.js"></script>
  <script src="./lcd-indicator.js"></script>
  <script src="./project-preview-adapter.js"></script>
  <script src="./transfer-storage.js"></script>
  <script src="./qr-transfer.js"></script>
  <script src="./qr-camera.js"></script>
  <script src="./local-hub-client.js"></script>
  <script src="./transfer-panel.js"></script>
  <script src="./po33-sampling.js"></script>
  <script src="./app.js"></script>
</body>
</html>
